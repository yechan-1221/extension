<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: sans-serif; margin: 0; padding: 20px; background: #f4f7f6; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; border-top: 5px solid #2ecc71; }
        .title { font-weight: bold; font-size: 16px; margin-bottom: 10px; }
        .msg { font-size: 14px; color: #555; text-align: center; }
        .timer { margin-top: 15px; font-size: 12px; color: #e74c3c; }
        .close-btn { margin-top: 15px; padding: 8px 16px; background: #34495e; color: white; border: none; cursor: pointer; border-radius: 4px; }
    </style>
</head>
<body>
    <div id="title" class="title">UprightAI</div>
    <div id="message" class="msg">상태를 확인하는 중...</div>
    <div id="timer-display" class="timer"></div>
    <button id="close-btn" class="close-btn">닫기</button>

    <script src="alert.js"></script>
</body>
</html>
