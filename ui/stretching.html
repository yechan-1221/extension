<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>스트레칭</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: #1a1d27;
      border-radius: 20px;
      padding: 40px 36px;
      text-align: center;
      max-width: 340px;
      width: 90%;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .emoji { font-size: 48px; margin-bottom: 16px; }
    h2 { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
    p  { font-size: 13px; color: #94a3b8; line-height: 1.6; margin-bottom: 24px; }
    .steps {
      text-align: left;
      background: rgba(255,255,255,0.04);
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 24px;
    }
    .steps li {
      font-size: 13px;
      color: #cbd5e1;
      margin-bottom: 8px;
      list-style: none;
      padding-left: 4px;
    }
    .steps li:last-child { margin-bottom: 0; }
    .steps li::before { content: "✦ "; color: #6366f1; }
    button {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      background: #6366f1;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #4f52d6; }
  </style>
</head>
<body>
  <div class="card">
    <div class="emoji">🧘</div>
    <h2>잠깐, 스트레칭 해요!</h2>
    <p>오늘 거북목 자세가 오래 지속됐어요.<br>3분간 목과 어깨를 풀어주세요.</p>
    <ul class="steps">
      <li>고개를 천천히 좌우로 기울이기 (10초씩)</li>
      <li>어깨를 크게 앞뒤로 돌리기 (10회)</li>
      <li>턱을 당겨 목을 곧게 세우기 (10초 유지)</li>
      <li>깍지 끼고 머리 위로 쭉 펴기 (10초)</li>
    </ul>
    <button id="doneBtn">스트레칭 완료 ✓</button>
  </div>

  <script>
    document.getElementById('doneBtn').addEventListener('click', () => {
      // 부모 창(popup.js)에 완료 신호 전달
      chrome.runtime.sendMessage({ type: 'STRETCHING_DONE' });
      window.close();
    });
  </script>
</body>
</html>
