<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>스트레칭 모드 — UprightAI</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap');

:root {
  --bg:     #E6E9F2;
  --bg2:    #DCE0EB;
  --bg3:    #CDD2DF;
  --ink:    #1E2235;
  --ink2:   #4D5470;
  --ink3:   #8A90A8;
  --good:   #2E9E72;
  --goodbg: rgba(46,158,114,0.10);
  --warn:   #B07A10;
  --warnbg: rgba(176,122,16,0.10);
  --risk:   #C04040;
  --riskbg: rgba(192,64,64,0.10);
  --ac:     #5567DC;
  --acbg:   rgba(85,103,220,0.10);
  --acbd:   rgba(85,103,220,0.25);

  /* neumorphism shadows — gray-blue palette */
  --nm-raise: 5px 5px 14px rgba(163,170,195,0.60), -4px -4px 10px rgba(255,255,255,0.90);
  --nm-inset: inset 3px 3px 8px rgba(163,170,195,0.55), inset -3px -3px 7px rgba(255,255,255,0.85);
  --nm-soft:  3px 3px 8px rgba(163,170,195,0.50), -3px -3px 6px rgba(255,255,255,0.88);
  --nm-pill:  4px 4px 10px rgba(163,170,195,0.55), -3px -3px 8px rgba(255,255,255,0.90);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Noto Sans KR', -apple-system, sans-serif;
  background: var(--bg);
  color: var(--ink);
  width: 400px;
  height: 600px;
  font-size: 13px;
  -webkit-font-smoothing: antialiased;
  display: flex;
  flex-direction: column;
}

/* ── HEADER ── */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 14px 8px;
  background: var(--bg);
  box-shadow: 0 2px 8px rgba(163,170,195,0.30);
  flex-shrink: 0;
  z-index: 10;
}
.hl { display: flex; align-items: center; gap: 10px; }
.logo {
  width: 34px; height: 34px;
  border-radius: 10px;
  background: var(--bg);
  box-shadow: var(--nm-soft);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
}
.htitle { font-size: 14px; font-weight: 800; letter-spacing: -.02em; }
.hsub   { font-size: 10px; color: var(--good); font-weight: 600; }

/* ── CAMERA ── */
.ps-cam-wrap {
  position: relative;
  flex: 1;
  min-height: 0;
  background: #1A1612;
  overflow: hidden;
}
#stretchVideo  { width: 100%; height: 100%; object-fit: cover; display: block; }
#stretchCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }

/* ── PANEL ── */
.ps-panel {
  background: var(--bg);
  border-top: 1px solid rgba(168,154,138,0.25);
  padding: 12px 14px;
  display: flex; flex-direction: column; gap: 9px;
  flex-shrink: 0;
}
.ps-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  align-items: stretch;
}

.ps-info-box {
  height: 46px;
  border-radius: 12px;
  background: var(--bg);
  box-shadow: var(--nm-soft);
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
}

/* 왼쪽 상태 박스 */
.ps-pill {
  position: relative;
  padding: 0 8px;
  font-size: 12px;
  font-weight: 700;
  color: var(--ink);
}

.ps-pill span {
  width: 100%;
  text-align: center;
}

.ps-pill-dot {
  position: absolute;
  left: 10px;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--warn);
  transition: background .2s;
}

/* 가운데 CVA 박스 */
.ps-cva {
  flex-direction: column;
  gap: 2px;
}

.ps-cva-value {
  font-size: 14px;
  font-weight: 800;
  color: var(--ac);
  line-height: 1;
}

.ps-cva-label {
  font-size: 9px;
  font-weight: 700;
  color: var(--ink3);
  line-height: 1;
}

/* 오른쪽 성공 횟수 박스 */
.ps-counter {
  flex-direction: column;
  gap: 2px;
}

.ps-cnum {
  font-size: 18px;
  font-weight: 800;
  color: var(--good);
  line-height: 1;
}

.ps-clabel {
  font-size: 9px;
  font-weight: 700;
  color: var(--ink3);
  line-height: 1;
}

.ps-feedback-box {
  background: var(--bg);
  box-shadow: var(--nm-soft);
  border-radius: 14px;
  padding: 22px 14px 20px;
  text-align: center;
}

.ps-fmain {
  font-size: 22px;
  font-weight: 800;
  color: var(--ink);
  text-align: center;
  line-height: 1.3;
  min-height: 28px;
  margin-bottom: 8px;
}

.ps-fdetail {
  font-size: 16px;
  font-weight: 700;
  color: var(--ink2);
  text-align: center;
  line-height: 1.4;
  min-height: 22px;
}

.ps-thinbar {
  width: 42%;
  height: 4px;
  margin: 14px auto 0;
  border-radius: 999px;
  background: rgba(138, 144, 168, 0.25);
}

.ps-btns {
  display: block;
  width: 100%;
}

.ps-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  padding: 12px 8px;
  border-radius: 11px;
  border: none;
  font-size: 13px;
  font-weight: 700;
  text-align: center;
  cursor: pointer;
  font-family: inherit;
  transition: all .15s;
}

#baselineBtn {
  background: var(--ac);
  color: #fff;
  box-shadow: 3px 3px 8px rgba(85,103,220,0.30), -2px -2px 5px rgba(255,255,255,0.4);
}

#baselineBtn:hover {
  background: #4A5EC8;
}
</style>
</head>
<body>

<div class="header">
  <div class="hl">
    <div class="logo">🧘</div>
    <div>
      <div class="htitle">스트레칭 모드</div>
      <div class="hsub">턱당기기 운동</div>
    </div>
  </div>
</div>

<div class="ps-cam-wrap">
  <video id="stretchVideo" autoplay playsinline muted></video>
  <canvas id="stretchCanvas"></canvas>
</div>

<div class="ps-panel">
  <div class="ps-row">
    <div class="ps-info-box ps-pill">
      <div class="ps-pill-dot" id="stretchPillDot"></div>
      <span id="stretchPillText">준비 중</span>
    </div>

    <div class="ps-info-box ps-cva">
      <div class="ps-cva-label">현재 각도</div>
      <div class="ps-cva-value" id="stretchCvaValue">CVA --</div>  
    </div>

    <div class="ps-info-box ps-counter">
      <div class="ps-clabel">성공 횟수</div>
      <div class="ps-cnum" id="stretchSuccessNum">0</div>
    </div>
  </div>
  <div class="ps-feedback-box">
    <div class="ps-fmain" id="stretchFeedbackMain">기준 자세 측정 버튼을 눌러 시작하세요</div>
    <div class="ps-fdetail" id="stretchFeedback"></div>
    <div class="ps-thinbar"></div>
  </div>

  <div class="ps-btns">
    <button class="ps-btn" id="baselineBtn">기준 자세 측정</button>
  </div>
</div>

<script src="lib/tf-core.min.js"></script>
<script src="lib/tf-backend-cpu.min.js"></script>
<script src="lib/tf-converter.min.js"></script>
<script src="lib/pose-detection.min.js"></script>
<script src="stretching.js" type="module"></script>
</body>
</html>
