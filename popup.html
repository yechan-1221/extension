<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>UprightAI</title>
<style>
:root {
  --bg: #FAF8F5; --surface: #FFFFFF; --surface-2: #F3EFE8;
  --border: #E8E2D7; --ink: #1C1A17; --ink-2: #4A463F; --ink-3: #8B857B;
  --good: #2E7D5B; --warn: #C57B2E; --risk: #C4513A;
  --accent: #2E5C7D; --accent-soft: #D6E1EB;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Pretendard', -apple-system, sans-serif;
  background: var(--bg); color: var(--ink);
  width: 420px; min-height: 600px;
}

/* ── 로그인/회원가입 화면 ── */
#page-login {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  min-height: 600px; padding: 40px 32px;
}
.login-logo { font-size: 36px; margin-bottom: 8px; }
.login-title { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 4px; }
.login-sub { font-size: 12px; color: var(--ink-3); margin-bottom: 24px; }

.auth-tabs { display: flex; width: 100%; margin-bottom: 20px; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.auth-tab-btn {
  flex: 1; padding: 10px; font-size: 13px; font-weight: 600;
  color: var(--ink-3); border: none; background: var(--surface-2); cursor: pointer;
  transition: all .15s;
}
.auth-tab-btn.active { background: var(--accent); color: #fff; }

.auth-form { display: none; width: 100%; }
.auth-form.active { display: block; }

.login-label { font-size: 11px; font-weight: 600; color: var(--ink-3); margin-bottom: 6px; display: block; }
.login-input {
  width: 100%; padding: 10px 12px; border: 1px solid var(--border);
  border-radius: 8px; font-size: 14px; background: var(--surface);
  margin-bottom: 12px; outline: none;
}
.login-input:focus { border-color: var(--accent); }
.login-btn {
  width: 100%; padding: 12px; border-radius: 10px;
  background: var(--accent); color: #fff; border: none;
  font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 4px;
}
.login-msg { font-size: 12px; color: var(--risk); margin-top: 10px; text-align: center; min-height: 18px; }
.login-msg.success { color: var(--good); }

/* ── 메인 화면 ── */
#page-main { display: none; }
.header {
  padding: 14px 18px 10px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  background: var(--surface);
}
.header-title { font-size: 15px; font-weight: 700; letter-spacing: -0.02em; }
.header-sub { font-size: 11px; color: var(--ink-3); margin-top: 2px; }
.status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); display: inline-block; margin-right: 6px; }
.tabs { display: flex; background: var(--surface); border-bottom: 1px solid var(--border); }
.tab-btn {
  flex: 1; padding: 10px; font-size: 12px; font-weight: 500;
  color: var(--ink-3); border: none; background: none; cursor: pointer;
  border-bottom: 2px solid transparent; transition: all .15s;
}
.tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
.cam-wrap { position: relative; background: #1C1A17; width: 100%; aspect-ratio: 4/3; overflow: hidden; }
#webcam { width: 100%; height: 100%; object-fit: cover; display: block; }
#overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
.cam-badge {
  position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
  background: rgba(28,26,23,0.75); border-radius: 20px; padding: 5px 14px;
  font-size: 12px; font-weight: 600; color: #fff; white-space: nowrap;
}
.cam-badge.normal { color: #5DCAA5; }
.cam-badge.borderline { color: #F5E4CE; }
.cam-badge.severe { color: #F0997B; }
.live-metrics { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; padding: 12px; }
.lm-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
.lm-label { font-size: 10px; color: var(--ink-3); font-weight: 500; margin-bottom: 4px; }
.lm-value { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; }
.lm-unit { font-size: 10px; color: var(--ink-3); }
.stats-wrap { padding: 12px; }
.section-title { font-size: 11px; font-weight: 600; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.05em; margin: 12px 0 8px; }
.metric-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 4px; }
.metric-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px; }
.metric-label { font-size: 11px; color: var(--ink-3); margin-bottom: 6px; font-weight: 500; }
.metric-value { font-size: 28px; font-weight: 700; letter-spacing: -0.03em; line-height: 1; }
.metric-unit { font-size: 12px; color: var(--ink-3); font-weight: 500; margin-left: 3px; }
.donut-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 8px; }
.donut-title { font-size: 11px; color: var(--ink-3); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
.donut-row { display: flex; align-items: center; gap: 12px; }
#donutChart { width: 90px; height: 90px; flex-shrink: 0; }
.donut-legend { flex: 1; }
.legend-item { display: flex; align-items: center; gap: 8px; font-size: 12px; margin-bottom: 7px; }
.legend-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
.legend-label { color: var(--ink-2); flex: 1; }
.legend-val { font-weight: 600; color: var(--ink); }
.insight { display: flex; gap: 10px; padding: 12px 14px; border-radius: 10px; background: var(--accent-soft); border: 1px solid #BBCDDD; margin-bottom: 8px; }
.insight-icon { font-size: 16px; flex-shrink: 0; margin-top: 1px; }
.insight h4 { font-size: 12px; color: var(--accent); font-weight: 600; margin-bottom: 2px; }
.insight p { font-size: 12px; color: var(--ink); line-height: 1.5; }
.privacy { padding: 9px 12px; border-radius: 8px; background: var(--surface-2); border: 1px dashed #D9D1C2; font-size: 11px; color: var(--ink-2); margin-bottom: 10px; }
.refresh-btn { width: 100%; padding: 10px; border-radius: 10px; background: var(--accent); color: #fff; border: none; font-size: 13px; font-weight: 600; cursor: pointer; margin-top: 4px; }
.tab-page { display: none; }
.tab-page.active { display: block; }
.page { display: none; }
.page.active { display: block; }
</style>
</head>
<body>

<!-- 로그인/회원가입 화면 -->
<div id="page-login" class="page active">
  <div class="login-logo">🧘</div>
  <div class="login-title">UprightAI</div>
  <div class="login-sub">B2B 자세 관리 AI 솔루션</div>

  <div class="auth-tabs">
    <button class="auth-tab-btn active" id="authTabLogin">로그인</button>
    <button class="auth-tab-btn" id="authTabRegister">회원가입</button>
  </div>

  <!-- 로그인 폼 -->
  <div class="auth-form active" id="formLogin">
    <label class="login-label">아이디</label>
    <input class="login-input" id="loginId" type="text" placeholder="user_id 입력">
    <label class="login-label">비밀번호</label>
    <input class="login-input" id="loginPw" type="password" placeholder="비밀번호 입력">
    <button class="login-btn" id="loginBtn">로그인</button>
    <div class="login-msg" id="loginMsg"></div>
  </div>

  <!-- 회원가입 폼 -->
  <div class="auth-form" id="formRegister">
    <label class="login-label">이름</label>
    <input class="login-input" id="regName" type="text" placeholder="이름 입력">
    <label class="login-label">아이디</label>
    <input class="login-input" id="regId" type="text" placeholder="user_id (3자 이상)">
    <label class="login-label">비밀번호</label>
    <input class="login-input" id="regPw" type="password" placeholder="비밀번호 (6자 이상)">
    <button class="login-btn" id="registerBtn">회원가입</button>
    <div class="login-msg" id="registerMsg"></div>
  </div>
</div>

<!-- 메인 화면 -->
<div id="page-main" class="page">
  <div class="header">
    <div>
      <div class="header-title">🧘 UprightAI</div>
      <div class="header-sub">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">연결 중...</span>
      </div>
    </div>
    <div style="font-size:11px;color:var(--ink-3);text-align:right;">
      <div id="headerUser"></div>
      <div id="headerTime" style="margin-top:2px;"></div>
      <button id="logoutBtn" style="margin-top:5px;padding:3px 10px;font-size:11px;border-radius:6px;border:1px solid var(--border);background:var(--surface-2);color:var(--ink-3);cursor:pointer;">종료</button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" id="tab-live">실시간 측정</button>
    <button class="tab-btn" id="tab-stats">오늘 통계</button>
  </div>

  <div class="tab-page active" id="tab-live-page">
    <div class="cam-wrap">
      <video id="webcam" autoplay playsinline></video>
      <canvas id="overlay"></canvas>
      <div class="cam-badge" id="camBadge">로딩 중...</div>
    </div>
    <div class="live-metrics">
      <div class="lm-card">
        <div class="lm-label">CVA 각도</div>
        <div><span class="lm-value" id="liveCVA">--</span><span class="lm-unit">°</span></div>
      </div>
      <div class="lm-card">
        <div class="lm-label">현재 상태</div>
        <div class="lm-value" id="liveState" style="font-size:13px;margin-top:3px;">--</div>
      </div>
      <div class="lm-card">
        <div class="lm-label">감지 방향</div>
        <div class="lm-value" id="liveSide" style="font-size:13px;margin-top:3px;">--</div>
      </div>
    </div>
  </div>

  <div class="tab-page" id="tab-stats-page">
    <div class="stats-wrap">
      <div class="privacy">🔒 측정값만 저장됩니다. 영상은 서버로 전송되지 않습니다.</div>
      <div class="section-title">오늘의 요약</div>
      <div class="metric-grid">
        <div class="metric-card">
          <div class="metric-label">평균 CVA</div>
          <div><span class="metric-value" id="statAvgCVA">--</span><span class="metric-unit">°</span></div>
        </div>
        <div class="metric-card">
          <div class="metric-label">거북목 감지</div>
          <div><span class="metric-value" id="statCount">--</span><span class="metric-unit">회</span></div>
        </div>
        <div class="metric-card">
          <div class="metric-label">평균 지속 시간</div>
          <div><span class="metric-value" id="statDuration">--</span><span class="metric-unit">초</span></div>
        </div>
        <div class="metric-card">
          <div class="metric-label">거북목 비율</div>
          <div><span class="metric-value" id="statRatio">--</span><span class="metric-unit">%</span></div>
        </div>
      </div>
      <div class="section-title">자세 분포</div>
      <div class="donut-wrap">
        <div class="donut-title">STATE 분포</div>
        <div class="donut-row">
          <canvas id="donutChart" width="90" height="90"></canvas>
          <div class="donut-legend">
            <div class="legend-item">
              <div class="legend-dot" style="background:#2E7D5B"></div>
              <div class="legend-label">정상</div>
              <div class="legend-val" id="lgNormal">--</div>
            </div>
            <div class="legend-item">
              <div class="legend-dot" style="background:#C4513A"></div>
              <div class="legend-label">거북목</div>
              <div class="legend-val" id="lgSevere">--</div>
            </div>
          </div>
        </div>
      </div>
      <div class="insight">
        <div class="insight-icon">💡</div>
        <div>
          <h4>분석 중...</h4>
          <p id="insightText">통계를 불러오는 중입니다.</p>
        </div>
      </div>
      <button class="refresh-btn" id="refresh-btn">새로고침</button>
    </div>
  </div>
</div>

<script src="lib/tf-core.min.js"></script>
<script src="lib/tf-backend-cpu.min.js"></script>
<script src="lib/tf-converter.min.js"></script>
<script src="lib/pose-detection.min.js"></script>
<script src="popup.js" type="module"></script>

<!-- 스트레칭 페이지 -->
<div id="page-stretching" class="page" style="display:none;flex-direction:column;align-items:center;padding:20px 16px;gap:12px;">
  <div style="font-size:15px;font-weight:700;color:var(--ink-1);text-align:center;">🧘 스트레칭 모드</div>
  <div style="font-size:12px;color:var(--ink-2);text-align:center;line-height:1.5;">
    옆모습으로 앉은 뒤 기준 자세를 측정하고<br>턱당기기 스트레칭을 진행해주세요.
  </div>
  <div class="video-wrapper" style="position:relative;width:100%;">
    <video id="stretchVideo" autoplay playsinline muted style="width:100%;border-radius:10px;"></video>
    <canvas id="stretchCanvas" style="position:absolute;top:0;left:0;width:100%;height:100%;border-radius:10px;"></canvas>
  </div>
  <div id="stretchFeedback" style="font-size:13px;color:var(--ink-2);text-align:center;min-height:36px;"></div>
  <button id="baselineBtn" style="width:100%;padding:10px;border-radius:10px;border:none;background:var(--accent);color:#fff;font-size:13px;font-weight:600;cursor:pointer;">기준 자세 측정</button>
  <button id="stretchDoneBtn" style="width:100%;padding:10px;border-radius:10px;border:1px solid var(--border);background:var(--surface-2);color:var(--ink-2);font-size:13px;cursor:pointer;">스트레칭 완료 ✓</button>
</div>

</body>
</html>
