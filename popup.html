<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>UprightAI</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap');

:root {
  --bg:     #E6E9F2;
  --bg2:    #DCE0EB;
  --bg3:    #CDD2DF;
  --ink:    #1E2235;
  --ink2:   #4D5470;
  --ink3:   #8A90A8;
  --good:   #2E9E72;
  --goodbg: rgba(46,158,114,0.10);
  --warn:   #B07A10;
  --warnbg: rgba(176,122,16,0.10);
  --risk:   #C04040;
  --riskbg: rgba(192,64,64,0.10);
  --ac:     #5567DC;
  --acbg:   rgba(85,103,220,0.10);
  --acbd:   rgba(85,103,220,0.25);

  /* neumorphism shadows — gray-blue palette */
  --nm-raise: 5px 5px 14px rgba(163,170,195,0.60), -4px -4px 10px rgba(255,255,255,0.90);
  --nm-inset: inset 3px 3px 8px rgba(163,170,195,0.55), inset -3px -3px 7px rgba(255,255,255,0.85);
  --nm-soft:  3px 3px 8px rgba(163,170,195,0.50), -3px -3px 6px rgba(255,255,255,0.88);
  --nm-pill:  4px 4px 10px rgba(163,170,195,0.55), -3px -3px 8px rgba(255,255,255,0.90);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Noto Sans KR', -apple-system, sans-serif;
  background: var(--bg);
  color: var(--ink);
  width: 400px;
  min-height: 600px;
  font-size: 13px;
  -webkit-font-smoothing: antialiased;
}

/* ── PAGE / TAB SWITCHING ── */
.page     { display: none; }
.page.active { display: flex; flex-direction: column; min-height: 600px; }
/* page-main fills remaining space */
#page-main.active  { min-height: 600px; }
.tab-page { display: none; }
.tab-page.active { display: block; }

/* ═══════════════════════════════
   HEADER
═══════════════════════════════ */
.header {
  padding: 14px 16px 12px;
  background: var(--bg);
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid rgba(168,154,138,0.25);
  flex-shrink: 0;
}
.hl { display: flex; align-items: center; gap: 10px; }
.logo {
  width: 34px; height: 34px;
  border-radius: 10px;
  background: var(--bg);
  box-shadow: var(--nm-soft);
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
}
.htitle { font-size: 14px; font-weight: 800; letter-spacing: -.02em; }
.hsub {
  font-size: 10.5px; color: var(--ink3);
  margin-top: 1px;
  display: flex; align-items: center; gap: 5px;
}
.sdot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--warn);
  display: inline-block;
  transition: background .4s;
}
.hr  { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.huser { font-size: 11px; color: var(--ink2); font-weight: 600; }
.htime { font-size: 11px; color: var(--ink3); font-variant-numeric: tabular-nums; }

/* ═══════════════════════════════
   TABS
═══════════════════════════════ */
.tabs {
  display: flex;
  background: var(--bg);
  border-bottom: 1px solid rgba(168,154,138,0.25);
  padding: 0 6px;
  flex-shrink: 0;
}
.tab-btn {
  flex: 1;
  padding: 10px 4px;
  font-size: 11px; font-weight: 700;
  color: var(--ink3);
  border: none; background: none;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: all .15s;
  font-family: inherit;
  position: relative;
  letter-spacing: -.01em;
}
.tab-btn.active { color: var(--ac); border-bottom-color: var(--ac); }
.sbadge {
  position: absolute; top: 7px; right: 6px;
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--risk);
  display: none;
}
.sbadge.show { display: block; }

/* ═══════════════════════════════
   CAMERA SECTION
═══════════════════════════════ */
.cam-wrap {
  position: relative;
  background: #1A1612;
  width: 100%;
  aspect-ratio: 4/3;
  overflow: hidden;
  flex-shrink: 0;
}
#webcam {
  width: 100%; height: 100%;
  object-fit: cover;
  display: block;
}
#overlay {
  position: absolute; top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
}
.cam-pill {
  position: absolute; top: 10px; left: 10px;
  display: flex; align-items: center; gap: 6px;
  background: rgba(237,232,223,0.88);
  border-radius: 20px;
  padding: 5px 11px;
  font-size: 11px; font-weight: 700;
  color: var(--ink);
  backdrop-filter: blur(8px);
  box-shadow: 2px 2px 8px rgba(0,0,0,0.20);
}
.cpill-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--warn); }
.cam-badge {
  position: absolute; bottom: 10px; left: 50%;
  transform: translateX(-50%);
  border-radius: 20px;
  padding: 6px 18px;
  font-size: 12px; font-weight: 700;
  white-space: nowrap;
  backdrop-filter: blur(8px);
  transition: all .3s;
}
.cam-badge.normal  { background: rgba(237,232,223,0.90); color: var(--good); box-shadow: 2px 2px 8px rgba(0,0,0,0.18); }
.cam-badge.severe  { background: rgba(237,232,223,0.90); color: var(--risk); box-shadow: 2px 2px 8px rgba(0,0,0,0.18); }
.cam-badge.default { background: rgba(237,232,223,0.78); color: var(--ink3); }

/* ── loading shimmer ── */
.cam-loading {
  position: absolute; inset: 0;
  background: #211D19;
  display: flex; align-items: center; justify-content: center;
  flex-direction: column; gap: 10px;
}
.cam-loading-icon { font-size: 28px; opacity: .5; }
.cam-loading-text { font-size: 11px; color: #6B5F52; font-weight: 600; }
.shimmer-bar {
  width: 120px; height: 3px; border-radius: 2px;
  background: linear-gradient(90deg,#3A322A 0%,#5A4E44 50%,#3A322A 100%);
  background-size: 200% 100%;
  animation: shimmer 1.4s infinite;
  border-radius: 2px;
}
@keyframes shimmer { 0%{background-position:100% 0} 100%{background-position:-100% 0} }

/* ═══════════════════════════════
   METRIC ROW
═══════════════════════════════ */
.mrow {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 8px;
  padding: 10px 12px;
  background: var(--bg);
  flex-shrink: 0;
}
.mcell {
  background: var(--bg);
  box-shadow: var(--nm-soft);
  border-radius: 12px;
  padding: 10px 12px;
  display: flex; flex-direction: column; gap: 3px;
}
.mlabel  { font-size: 9.5px; color: var(--ink3); font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }
.mval    { font-size: 20px; font-weight: 800; letter-spacing: -.03em; line-height: 1; font-variant-numeric: tabular-nums; color: var(--ink); }
.mval-sm { font-size: 12px; font-weight: 700; color: var(--ink2); margin-top: 1px; }
.munit   { font-size: 10px; color: var(--ink3); }

/* ═══════════════════════════════
   SESSION INFO BAR
═══════════════════════════════ */
.sinfo {
  padding: 8px 14px;
  display: flex; align-items: center; justify-content: space-between;
  flex-shrink: 0;
}
.slabel { font-size: 11px; color: var(--ink3); }
.sval   { font-size: 11px; color: var(--ink2); font-weight: 600; font-variant-numeric: tabular-nums; }

/* ═══════════════════════════════
   NFC / STATUS BANNER
═══════════════════════════════ */
.nfc-banner {
  margin: 6px 12px 10px;
  padding: 10px 14px;
  border-radius: 12px;
  background: var(--bg);
  box-shadow: var(--nm-soft);
  display: flex; align-items: flex-start; gap: 10px;
  flex-shrink: 0;
}
.nfc-banner.bad-posture {
  box-shadow: inset 2px 2px 6px rgba(192,64,64,0.12), inset -2px -2px 5px rgba(255,252,245,0.70), 0 0 0 1px rgba(192,64,64,0.15);
}
.nfc-icon  { font-size: 15px; flex-shrink: 0; margin-top: 1px; }
.nfc-title { font-size: 12px; font-weight: 700; color: var(--good); margin-bottom: 2px; }
.nfc-title.bad { color: var(--risk); }
.nfc-sub   { font-size: 11px; color: var(--ink2); line-height: 1.5; }

/* ═══════════════════════════════
   SURVEY TAB
═══════════════════════════════ */
.sw-wrap {
  padding: 12px;
  overflow-y: auto;
  flex: 1;
}
.sv-banner {
  border-radius: 12px;
  padding: 11px 14px;
  margin-bottom: 14px;
  display: flex; align-items: flex-start; gap: 10px;
  background: var(--bg);
}
.sv-banner.wednesday { box-shadow: var(--nm-soft), 0 0 0 1.5px rgba(196,124,26,0.20); }
.sv-banner.done      { box-shadow: var(--nm-soft), 0 0 0 1.5px rgba(46,158,114,0.20); }
.sv-banner.waiting   { box-shadow: var(--nm-inset); }
.sv-bicon   { font-size: 15px; flex-shrink: 0; margin-top: 1px; }
.sv-btitle  { font-size: 12px; font-weight: 700; margin-bottom: 2px; }
.sv-banner.wednesday .sv-btitle { color: var(--warn); }
.sv-banner.done      .sv-btitle { color: var(--good); }
.sv-banner.waiting   .sv-btitle { color: var(--ink2); }
.sv-bsub    { font-size: 11px; color: var(--ink2); line-height: 1.5; }

.sv-sec     { margin-bottom: 14px; }
.sv-qlabel  { font-size: 11px; font-weight: 700; color: var(--ink2); margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
.sv-qnum    {
  width: 20px; height: 20px; border-radius: 6px;
  background: var(--bg);
  box-shadow: var(--nm-soft);
  color: var(--ac); font-size: 10px; font-weight: 800;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.sl-wrap    { display: flex; align-items: center; gap: 10px; }
.sl-track   {
  flex: 1;
  -webkit-appearance: none;
  appearance: none;
  height: 5px;
  border-radius: 3px;
  background: var(--bg);
  box-shadow: var(--nm-inset);
  outline: none; cursor: pointer;
}
.sl-track::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 18px; height: 18px;
  border-radius: 50%;
  background: var(--bg);
  box-shadow: var(--nm-raise);
  cursor: pointer;
  border: 2px solid rgba(85,103,220,0.3);
}
.sl-val     { width: 30px; text-align: center; font-size: 14px; font-weight: 800; color: var(--ac); font-variant-numeric: tabular-nums; }
.sl-labels  { display: flex; justify-content: space-between; margin-top: 5px; padding: 0 2px; }
.sl-labels span { font-size: 10px; color: var(--ink3); }

.ch-row { display: flex; gap: 6px; }
.ch-btn {
  flex: 1;
  padding: 9px 6px;
  border-radius: 10px;
  border: none;
  background: var(--bg);
  box-shadow: var(--nm-soft);
  color: var(--ink2);
  font-size: 12px; font-weight: 700;
  cursor: pointer;
  text-align: center;
  transition: all .15s;
  font-family: inherit;
}
.ch-btn:hover { box-shadow: var(--nm-raise); color: var(--ink); }
.ch-btn.selected {
  box-shadow: var(--nm-inset);
  color: var(--ac);
}
.cmnt-input {
  width: 100%;
  padding: 10px 13px;
  border-radius: 10px;
  border: none;
  background: var(--bg);
  box-shadow: var(--nm-inset);
  color: var(--ink);
  font-size: 12px; font-family: inherit;
  resize: none; outline: none; line-height: 1.5;
}
.cmnt-input::placeholder { color: var(--ink3); }
.submit-btn {
  width: 100%;
  padding: 13px;
  border-radius: 12px;
  background: var(--ac);
  color: #fff;
  border: none;
  font-size: 13px; font-weight: 700;
  cursor: pointer;
  font-family: inherit;
  margin-top: 4px;
  box-shadow: 4px 4px 10px rgba(85,103,220,0.35), -2px -2px 6px rgba(255,255,255,0.4);
  transition: all .18s;
}
.submit-btn:hover { background: #4A5EC8; }
.submit-btn:active { transform: scale(0.98); }
.submit-btn:disabled { background: var(--bg3); color: var(--ink3); cursor: not-allowed; box-shadow: var(--nm-inset); transform: none; }

.result-card { display: none; border-radius: 12px; padding: 18px; margin-top: 12px; text-align: center; background: var(--bg); }
.result-card.show { display: block; }
.result-card.green { box-shadow: var(--nm-soft), 0 0 0 1.5px rgba(46,158,114,0.25); }
.result-card.yellow{ box-shadow: var(--nm-soft), 0 0 0 1.5px rgba(196,124,26,0.25); }
.result-card.red   { box-shadow: var(--nm-soft), 0 0 0 1.5px rgba(192,64,64,0.25); }
.r-emoji  { font-size: 30px; margin-bottom: 8px; }
.r-label  { font-size: 13px; font-weight: 800; margin-bottom: 5px; }
.result-card.green .r-label { color: var(--good); }
.result-card.yellow .r-label{ color: var(--warn); }
.result-card.red   .r-label { color: var(--risk); }
.r-desc   { font-size: 11px; color: var(--ink2); line-height: 1.55; }
.r-saved  { margin-top: 10px; font-size: 10px; color: var(--ink3); display: flex; align-items: center; justify-content: center; gap: 4px; }


/* ═══════════════════════════════
   DIVIDER
═══════════════════════════════ */
.divider { height: 1px; background: rgba(168,154,138,0.22); margin: 2px 0; flex-shrink: 0; }

</style>
</head>
<body>

<!-- ═══ MAIN PAGE ═══ -->
<div id="page-main" class="page active">
  <div class="header">
    <div class="hl">
      <div class="logo">🧘</div>
      <div>
        <div class="htitle">UprightAI</div>
        <div class="hsub"><span class="sdot" id="statusDot"></span><span id="statusText">연결 중...</span></div>
      </div>
    </div>
    <div class="hr">
      <div class="huser" id="headerUser"></div>
      <div class="htime" id="headerTime"></div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" id="tab-live">📡 실시간</button>
    <button class="tab-btn" id="tab-survey">📋 설문<span class="sbadge" id="surveyBadge"></span></button>
  </div>

  <!-- LIVE TAB -->
  <div class="tab-page active" id="tab-live-page">
    <div class="cam-wrap">
      <video id="webcam" autoplay playsinline muted></video>
      <canvas id="overlay"></canvas>
      <div class="cam-pill">
        <div class="cpill-dot" id="camStatusDot"></div>
        <span id="camStatusText">로딩 중</span>
      </div>
      <div class="cam-badge default" id="camBadge">카메라 초기화 중...</div>
    </div>

    <div class="mrow">
      <div class="mcell">
        <div class="mlabel">CVA 각도</div>
        <div style="display:flex;align-items:baseline;gap:2px">
          <span class="mval" id="liveCVA">--</span>
          <span class="munit">°</span>
        </div>
      </div>
      <div class="mcell">
        <div class="mlabel">현재 상태</div>
        <div class="mval-sm" id="liveState">--</div>
      </div>
      <div class="mcell">
        <div class="mlabel">감지 방향</div>
        <div class="mval-sm" id="liveSide">--</div>
      </div>
    </div>

    <div class="sinfo">
      <span class="slabel">오늘 거북목 감지</span>
      <span class="sval"><span id="sessionFhpCount">0</span>회 · 누적 <span id="sessionFhpSec">0</span>초</span>
    </div>

    <div class="divider"></div>

    <div class="nfc-banner" id="nfcBanner">
      <div class="nfc-icon">🏷️</div>
      <div>
        <div class="nfc-title" id="nfcTitle">사원증 태그 완료</div>
        <div class="nfc-sub" id="nfcBannerSub">자세 모니터링을 시작합니다.</div>
      </div>
    </div>
  </div>

  <!-- SURVEY TAB -->
  <div class="tab-page" id="tab-survey-page">
    <div class="sw-wrap">
      <div class="sv-banner waiting" id="surveyBanner">
        <div class="sv-bicon" id="surveyBannerIcon">📅</div>
        <div>
          <div class="sv-btitle" id="surveyBannerTitle">다음 설문일 안내</div>
          <div class="sv-bsub" id="surveyBannerSub">로딩 중...</div>
        </div>
      </div>

      <div class="sv-sec">
        <div class="sv-qlabel"><div class="sv-qnum">1</div>이번 주 업무량</div>
        <div class="sl-wrap">
          <input type="range" class="sl-track" id="q1" min="1" max="10" value="5">
          <div class="sl-val" id="q1val">5</div>
        </div>
        <div class="sl-labels"><span>여유로움</span><span>매우 많음</span></div>
      </div>

      <div class="sv-sec">
        <div class="sv-qlabel"><div class="sv-qnum">2</div>정신적 피로도</div>
        <div class="sl-wrap">
          <input type="range" class="sl-track" id="q2" min="1" max="10" value="5">
          <div class="sl-val" id="q2val">5</div>
        </div>
        <div class="sl-labels"><span>전혀 없음</span><span>극도로 높음</span></div>
      </div>

      <div class="sv-sec">
        <div class="sv-qlabel"><div class="sv-qnum">3</div>이번 주 수면 상태</div>
        <div class="ch-row">
          <button class="ch-btn" data-q="q3" data-val="충분">😴 충분</button>
          <button class="ch-btn" data-q="q3" data-val="보통">😐 보통</button>
          <button class="ch-btn" data-q="q3" data-val="부족">😵 부족</button>
        </div>
      </div>

      <div class="sv-sec">
        <div class="sv-qlabel"><div class="sv-qnum">4</div>번아웃 징후</div>
        <div class="ch-row">
          <button class="ch-btn" data-q="q4" data-val="전혀">🙂 전혀</button>
          <button class="ch-btn" data-q="q4" data-val="약간">😓 약간</button>
          <button class="ch-btn" data-q="q4" data-val="많이">🥵 많이</button>
        </div>
      </div>

      <div class="sv-sec">
        <div class="sv-qlabel"><div class="sv-qnum">5</div>자유 코멘트 <span style="color:var(--ink3);font-weight:400">(선택)</span></div>
        <textarea class="cmnt-input" id="q5" rows="2" placeholder="이번 주 힘들었던 점이나 건의사항을 자유롭게 남겨주세요."></textarea>
      </div>

      <button class="submit-btn" id="surveySubmitBtn">설문 제출하기</button>

      <div class="result-card" id="resultCard">
        <div class="r-emoji" id="resultEmoji"></div>
        <div class="r-label" id="resultLabel"></div>
        <div class="r-desc"  id="resultDesc"></div>
        <div class="r-saved">✅ Cosmos DB 저장 완료 · 관리자 대시보드에 반영됩니다</div>
      </div>
    </div>
  </div>
</div>


<script src="lib/tf-core.min.js"></script>
<script src="lib/tf-backend-cpu.min.js"></script>
<script src="lib/tf-backend-webgl.min.js"></script>
<script src="lib/tf-converter.min.js"></script>
<script src="lib/pose-detection.min.js"></script>
<script src="popup.js" type="module"></script>
</body>
</html>
